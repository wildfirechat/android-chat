apply plugin: 'com.android.library'
apply plugin: 'maven-publish'

// JitPack 多模块仓库的坐标必须是 com.github.<user>.<repo>:<module>，否则 JitPack 找不到该构建哪个仓库
group = 'com.github.wildfirechat.android-chat'
// JitPack 构建时注入 tag/commit，本地构建用占位版本
version = System.getenv('VERSION') ?: 'local'

android {
    compileSdkVersion 34


    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 34

        // testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
        ndk {
            // TODO: changes this for your application if needed
            moduleName = "mmnet"
            //abiFilter "armeabi" //去掉armeabi架构，armeabi-v7a可以兼容armeabi架构。
            abiFilter "armeabi-v7a"
            abiFilter "arm64-v8a"
            abiFilter "x86"
            abiFilter "x86_64"
        }
    }


    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }


    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }

    compileOptions {
        targetCompatibility 1.8
        sourceCompatibility 1.8
    }
    namespace 'cn.wildfirechat.client'
    lint {
        abortOnError false
    }
    buildFeatures {
        aidl true
    }
    publishing {
        singleVariant('release')
    }
}

publishing {
    publications {
        release(MavenPublication) {
            artifactId = 'client'
            afterEvaluate {
                from components.release
            }
        }
    }
}


dependencies {
    api project(':mars-core-release')
    api "androidx.lifecycle:lifecycle-viewmodel:2.8.7"
    api "androidx.lifecycle:lifecycle-livedata:2.8.7"
    api "androidx.lifecycle:lifecycle-process:2.8.7"
    api 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okio:okio:3.10.2'
}
