// JitPack 上只发布 SDK 需要的两个模块。其余模块要么依赖同级仓库（android-av、android-pttclient），
// 要么依赖未入库的签名/推送配置文件（wfc.keystore、agconnect-services.json），在 JitPack 的环境里不存在。
if (System.getenv('JITPACK') == 'true') {
    include ':client', ':mars-core-release'
    return
}

include ':chat'
include ':client',
    // 推送方案选择
    // 直接对接厂商推送
    ':push',
    // 对接个推，需要在个推后台配置厂商通道相关信息，才能使用厂商推送进行推送
//    ':push-getui',

    // 对接极光，需要在极光后台配置厂商通道相关信息，才能使用厂商推送进行推送
//    ':push-jpush',

    ':uikit',
    ':mars-core-release',
    // 如果不能从网络下载webrtc时，请取消下面的注释
    ':webrtc',
    ':badgeview',
    ":menu",
    ":permission",
    ':cameraview',
    ':uvccamera',
    ':uikit-aar-dep',
    ':emojilibrary',
    ':imagepicker',
//    ':momentclient',
    ':pttclient',
//    ':pttclient',
    ':avenginekit'

